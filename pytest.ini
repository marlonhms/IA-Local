[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests scripts
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Testes unitarios rapidos e isolados
    integration: Testes de integracao com banco de dados ou servicos
    e2e: Testes de ponta a ponta
addopts = -ra -q --ignore=scripts/test_ponte_tailscale.py
