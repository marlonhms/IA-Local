[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests
norecursedirs = scripts docs web .agents bin logs backups node_modules .venv venv
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Testes unitarios rapidos e isolados
    integration: Testes de integracao com banco de dados ou servicos
    e2e: Testes de ponta a ponta
addopts = -ra -q --tb=short
