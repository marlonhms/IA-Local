# ==============================================================================
# CONFIGURACAO DE PROXY REVERSO TLS/HTTPS NGINX (P1-5)
# Projeto: AURA (Autonomous Unified Retail Assistant)
# Rate Limiting, SSL Terminado, Protecao de Headers e Streaming SSE
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Otimizacoes de desempenho
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Compressao gzip para assets estaticos do frontend
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate limiting: maximo 30 requisicoes por minuto por IP para API
    limit_req_zone $binary_remote_addr zone=aura_api_limit:10m rate=30r/m;
    # Rate limiting mais estrito para mutacoes e vouchers: 5 requisicoes por minuto
    limit_req_zone $binary_remote_addr zone=aura_actions_limit:10m rate=5r/m;

    # Servidor HTTP: redireciona tudo para HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }

    # Servidor HTTPS com terminacao TLS
    server {
        listen 8443 ssl;
        server_name localhost;

        # Certificados TLS autoassinados ou oficiais
        ssl_certificate     /etc/ssl/certs/aura_cert.pem;
        ssl_certificate_key /etc/ssl/private/aura_key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Cabecalhos de protecao corporativa (OWASP / CIS Benchmark)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Endpoints de Acoes e Vouchers com Rate Limit Restrito
        location /api/v1/aura/actions/execute {
            limit_req zone=aura_actions_limit burst=3 nodelay;

            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Endpoints de Chat com Streaming SSE (Buffer desativado)
        location ~ ^/api/v1/aura/chat {
            limit_req zone=aura_api_limit burst=10 nodelay;

            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Otimizacoes criticas para Server-Sent Events (SSE)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            chunked_transfer_encoding off;
        }

        # Demais rotas da API e Frontend SPA
        location / {
            limit_req zone=aura_api_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
