<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="auraBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="auraCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="auraEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="leftFacet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0c121e" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="1"/>
      <stop offset="45%" stop-color="#10b981" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#0891b2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo Obsidian com Cantos Suaves -->
  <rect width="512" height="512" rx="112" fill="url(#auraBgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.18"/>

  <!-- Halo de Energia Neural -->
  <circle cx="256" cy="256" r="160" fill="url(#coreGlow)" opacity="0.15"/>

  <!-- Hexaedro Neural Isometrico: Facetas de Precisao -->
  <polygon points="256,76 412,166 256,256 100,166" fill="url(#topFacet)" stroke="#06b6d4" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="256,256 412,166 412,346 256,436" fill="url(#rightFacet)" stroke="#10b981" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="256,256 256,436 100,346 100,166" fill="url(#leftFacet)" stroke="#0891b2" stroke-width="3" stroke-linejoin="round"/>

  <!-- Arestas de Conexao Neural -->
  <line x1="256" y1="76" x2="256" y2="256" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
  <line x1="412" y1="346" x2="256" y2="256" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="346" x2="256" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>

  <!-- Perimetro Hexagonal de Precisao -->
  <polygon points="256,76 412,166 412,346 256,436 100,346 100,166" fill="none" stroke="url(#auraCyanGrad)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Vertices Neurais Satelites (Visiveis em 32pt+) -->
  <circle cx="256" cy="76" r="10" fill="#22d3ee"/>
  <circle cx="412" cy="166" r="10" fill="#06b6d4"/>
  <circle cx="412" cy="346" r="10" fill="#10b981"/>
  <circle cx="256" cy="436" r="10" fill="#34d399"/>
  <circle cx="100" cy="346" r="10" fill="#0891b2"/>
  <circle cx="100" cy="166" r="10" fill="#38bdf8"/>

  <!-- Anel Orbital de Decisao -->
  <circle cx="256" cy="256" r="62" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="14 8" opacity="0.8"/>

  <!-- Nucleo de Prontidao AURA (Emerald Core) -->
  <circle cx="256" cy="256" r="46" fill="url(#auraEmeraldGrad)" filter="url(#auraGlow)"/>
  <circle cx="256" cy="256" r="22" fill="#ffffff" opacity="0.95"/>
</svg>
