name: CI - AURA Core Engine Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Testes Automatizados e QA (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Checagem Estatica de Sintaxe e Linting (Ruff)
        run: |
          ruff check . --select E9,F63,F7,F82 --show-source
          ruff check . --exit-zero --statistics

      - name: Executar Suite de Testes (Pytest)
        run: |
          pytest tests/ -v
